<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether — AI Shopping</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #141417;
      --surface2: #1a1a1e;
      --surface3: #222228;
      --border: #2a2a30;
      --text: #f0f0f2;
      --muted: #9a9aa3;
      --accent: #a78bfa;
      --accent2: #c4b5fd;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --blue: #3b82f6;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
      font-size: 14px;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: #0f0f12;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .logo {
      font-weight: 700; font-size: 20px; text-decoration: none; color: var(--text);
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .logo span {
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .search-wrap {
      flex: 1; min-width: 180px; max-width: 560px; position: relative;
    }
    .search-wrap input {
      width: 100%; padding: 10px 14px 10px 38px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap .s-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 15px; pointer-events: none;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      position: relative; width: 40px; height: 40px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { border-color: var(--accent); }
    .badge-count {
      position: absolute; top: -5px; right: -5px;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      min-width: 17px; height: 17px; border-radius: 999px;
      display: none; align-items: center; justify-content: center; padding: 0 4px;
    }
    .cat-strip {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex; gap: 8px; overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-strip::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0; padding: 8px 16px; border-radius: 999px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; font-family: inherit;
      transition: all 0.15s;
    }
    .cat-chip:hover { color: var(--text); border-color: var(--muted); }
    .cat-chip.active {
      background: rgba(167,139,250,0.2);
      color: var(--accent2);
      border-color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      max-width: 1440px;
      margin: 0 auto;
      min-height: calc(100vh - 110px);
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .ai-side { display: none !important; }
      .ai-side.open {
        display: flex !important; position: fixed; inset: 0; z-index: 200;
        max-width: none;
      }
    }
    main { padding: 16px; overflow-x: hidden; }
    .banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #1e1b4b 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 16px;
    }
    .banner h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .banner p { color: var(--muted); font-size: 13px; margin-bottom: 12px; max-width: 420px; }
    .banner-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .b-tag {
      padding: 5px 12px; border-radius: 999px; font-size: 12px;
      background: rgba(167,139,250,0.18); color: var(--accent2);
      cursor: pointer; border: 1px solid transparent;
    }
    .b-tag:hover { border-color: var(--accent); }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      margin-bottom: 14px; justify-content: space-between;
    }
    .results-count { font-size: 13px; color: var(--muted); }
    .sort-select {
      padding: 7px 12px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }
    @media (min-width: 700px) {
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-img {
      height: 140px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 52px;
      position: relative;
    }
    .card-badge {
      position: absolute; top: 8px; left: 8px;
      background: var(--green); color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 4px; text-transform: uppercase;
    }
    .card-badge.deal { background: var(--red); }
    .card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
    .card-brand { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
    .card-name {
      font-size: 13px; font-weight: 600; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      line-height: 1.3; min-height: 34px;
    }
    .card-rating {
      display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px;
    }
    .stars { color: var(--orange); letter-spacing: -1px; }
    .rating-num { color: var(--muted); }
    .card-price-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .card-price { font-size: 16px; font-weight: 700; }
    .card-old { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .card-off { font-size: 12px; color: var(--green); font-weight: 600; }
    .card-actions { margin-top: auto; display: flex; gap: 6px; }
    .btn-add {
      flex: 1; padding: 8px; border-radius: 6px; border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .btn-add:hover { filter: brightness(1.1); }
    .empty {
      grid-column: 1 / -1; text-align: center; padding: 48px 20px; color: var(--muted);
    }
    .ai-side {
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: calc(100vh - 110px);
      position: sticky; top: 110px;
    }
    .ai-head {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .ai-head h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .ai-dot {
      width: 8px; height: 8px; background: var(--green); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ai-close {
      display: none; background: none; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer;
    }
    @media (max-width: 960px) { .ai-close { display: block; } }
    .ai-msgs {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg {
      max-width: 92%; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45;
    }
    .msg.ai {
      background: var(--surface2); border: 1px solid var(--border);
      align-self: flex-start; border-bottom-left-radius: 3px;
    }
    .msg.user {
      background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
      align-self: flex-end; border-bottom-right-radius: 3px;
    }
    .msg .sug {
      display: block; margin-top: 6px; padding: 5px 9px;
      background: rgba(167,139,250,0.15); border-radius: 6px;
      font-size: 12px; color: var(--accent2); cursor: pointer;
      border: 1px solid transparent;
    }
    .msg .sug:hover { border-color: var(--accent); }
    .ai-foot { padding: 10px 12px 14px; border-top: 1px solid var(--border); }
    .ai-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .chip {
      padding: 4px 10px; font-size: 11px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 999px; color: var(--muted);
      cursor: pointer; font-family: inherit;
    }
    .chip:hover { color: var(--accent2); border-color: var(--accent); }
    .ai-row { display: flex; gap: 6px; }
    .ai-row input {
      flex: 1; padding: 9px 12px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 13px; outline: none; font-family: inherit;
    }
    .ai-row input:focus { border-color: var(--accent); }
    .ai-go {
      width: 40px; height: 40px; border-radius: 8px; border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .cart-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 300;
      display: none; justify-content: flex-end;
    }
    .cart-bg.open { display: flex; }
    .cart-panel {
      width: 100%; max-width: 380px; background: var(--surface); height: 100%;
      display: flex; flex-direction: column; border-left: 1px solid var(--border);
      animation: slide 0.22s ease;
    }
    @keyframes slide { from{transform:translateX(100%)} to{transform:translateX(0)} }
    .cart-h {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-h h2 { font-size: 16px; }
    .cart-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
    .cart-item {
      display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .cart-item-img {
      width: 56px; height: 56px; background: var(--surface2); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .cart-item-price { font-size: 13px; color: var(--muted); }
    .qty-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 6px; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-foot { padding: 14px 16px; border-top: 1px solid var(--border); }
    .cart-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .btn-checkout {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff;
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .empty-cart { text-align: center; padding: 40px 16px; color: var(--muted); }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--surface3); border: 1px solid var(--border); color: var(--text);
      padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 400;
      opacity: 0; transition: all 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .fab-ai {
      display: none; position: fixed; bottom: 20px; right: 20px;
      width: 54px; height: 54px; border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5); border: none;
      color: #fff; font-size: 22px; cursor: pointer; z-index: 90;
      box-shadow: 0 6px 20px rgba(124,58,237,0.45);
      align-items: center; justify-content: center;
    }
    @media (max-width: 960px) { .fab-ai { display: flex; } }
  </style>
</head>

    { id:45, name:"Soft Plush Teddy 40cm", brand:"Cuddle", cat:"Toys", price:449, old:799, emoji:"🧸", rating:4.4, reviews:9200, tags:["teddy","kids","gift"] },
    { id:46, name:"Organic Green Tea 100 Bags", brand:"TeaLeaf", cat:"Grocery", price:299, old:449, emoji:"🍵", rating:4.3, reviews:15000, tags:["tea","beverage"] },
    { id:47, name:"Almonds 500g Pack", brand:"NutriNuts", cat:"Grocery", price:449, old:699, emoji:"🥜", rating:4.4, reviews:22000, badge:"Deal", tags:["nuts","healthy"] },
    { id:48, name:"Dark Chocolate 70% 100g", brand:"CocoaBar", cat:"Grocery", price:149, old:249, emoji:"🍫", rating:4.5, reviews:18000, tags:["chocolate","snack"] }
  ];

  let cart = [];
  try { cart = JSON.parse(safeGet('aether_cart_v2', '[]')); if (!Array.isArray(cart)) cart = []; } catch (e) { cart = []; }
  let currentCat = 'all';
  let searchQ = '';
  let sortBy = 'popular';
  let filtered = PRODUCTS.slice();

  function fmt(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
  function discount(p) {
    if (!p.old || p.old <= p.price) return 0;
    return Math.round((1 - p.price / p.old) * 100);
  }
  function toast(m) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }
  function stars(r) {
    var full = Math.floor(r);
    var half = r - full >= 0.3 ? 1 : 0;
    return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - half);
  }

  function applyFilters() {
    filtered = PRODUCTS.filter(function(p) {
      var catOk = currentCat === 'all' || p.cat === currentCat;
      var q = searchQ.toLowerCase().trim();
      var searchOk = !q ||
        p.name.toLowerCase().indexOf(q) !== -1 ||
        p.brand.toLowerCase().indexOf(q) !== -1 ||
        p.cat.toLowerCase().indexOf(q) !== -1 ||
        (p.tags && p.tags.some(function(t) { return t.indexOf(q) !== -1; }));
      return catOk && searchOk;
    });

    if (sortBy === 'price-asc') filtered.sort(function(a, b) { return a.price - b.price; });
    else if (sortBy === 'price-desc') filtered.sort(function(a, b) { return b.price - a.price; });
    else if (sortBy === 'rating') filtered.sort(function(a, b) { return b.rating - a.rating; });
    else if (sortBy === 'discount') filtered.sort(function(a, b) { return discount(b) - discount(a); });
    else filtered.sort(function(a, b) { return (b.reviews || 0) - (a.reviews || 0); });

    renderGrid();
  }

  function renderGrid() {
    var grid = document.getElementById('grid');
    var count = document.getElementById('results-count');
    count.textContent = filtered.length + ' product' + (filtered.length !== 1 ? 's' : '') +
      (currentCat !== 'all' ? ' in ' + currentCat : '') +
      (searchQ ? ' for “' + searchQ + '”' : '');

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty">No products found. Try another category or ask the AI assistant.</div>';
      return;
    }

    grid.innerHTML = filtered.map(function(p) {
      var off = discount(p);
      var badgeClass = p.badge === 'Deal' ? 'deal' : '';
      return '<div class="card">' +
        '<div class="card-img">' + p.emoji +
        (p.badge ? '<span class="card-badge ' + badgeClass + '">' + p.badge + '</span>' : '') +
        '</div><div class="card-body">' +
        '<div class="card-brand">' + p.brand + '</div>' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-rating"><span class="stars">' + stars(p.rating) + '</span> ' +
        '<span class="rating-num">(' + (p.reviews || 0).toLocaleString('en-IN') + ')</span></div>' +
        '<div class="card-price-row"><span class="card-price">' + fmt(p.price) + '</span>' +
        (p.old ? '<span class="card-old">' + fmt(p.old) + '</span>' : '') +
        (off ? '<span class="card-off">' + off + '% off</span>' : '') +
        '</div><div class="card-actions">' +
        '<button class="btn-add" data-add="' + p.id + '" type="button">Add to Cart</button>' +
        '</div></div></div>';
    }).join('');
  }

  function saveCart() {
    safeSet('aether_cart_v2', JSON.stringify(cart));
    updateCartBadge();
  }
  function updateCartBadge() {
    var n = cart.reduce(function(s, c) { return s + c.qty; }, 0);
    var el = document.getElementById('cart-count');
    if (n > 0) { el.style.display = 'flex'; el.textContent = n; }
    else el.style.display = 'none';
  }
  function addToCart(id) {
    var p = PRODUCTS.find(function(x) { return x.id === id; });
    if (!p) return;
    var ex = cart.find(function(c) { return c.id === id; });
    if (ex) ex.qty++; else cart.push({ id: id, qty: 1 });
    saveCart();
    toast('Added ' + p.name);
  }
  function changeQty(id, d) {
    var item = cart.find(function(c) { return c.id === id; });
    if (!item) return;
    item.qty += d;
    if (item.qty <= 0) cart = cart.filter(function(c) { return c.id !== id; });
    saveCart();
    renderCart();
  }
  function renderCart() {
    var body = document.getElementById('cart-body');
    if (!cart.length) {
      body.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
      document.getElementById('cart-total').textContent = '₹0';
      return;
    }
    var total = 0;
    body.innerHTML = cart.map(function(c) {
      var p = PRODUCTS.find(function(x) { return x.id === c.id; });
      if (!p) return '';
      total += p.price * c.qty;
      return '<div class="cart-item"><div class="cart-item-img">' + p.emoji + '</div>' +
        '<div class="cart-item-info"><div class="cart-item-name">' + p.name + '</div>' +
        '<div class="cart-item-price">' + fmt(p.price) + ' × ' + c.qty + '</div>' +
        '<div class="qty-row">' +
        '<button class="qty-btn" data-qty="' + c.id + '" data-delta="-1" type="button">−</button>' +
        '<span>' + c.qty + '</span>' +
        '<button class="qty-btn" data-qty="' + c.id + '" data-delta="1" type="button">+</button>' +
        '</div></div></div>';
    }).join('');
    document.getElementById('cart-total').textContent = fmt(total);
  }

  function addMsg(text, isUser, suggestions) {
    var box = document.getElementById('ai-msgs');
    var div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'ai');
    var html = text.replace(/\n/g, '<br>');
    if (suggestions && suggestions.length) {
      html += suggestions.map(function(s) {
        return '<span class="sug" data-q="' + s.replace(/"/g, '&quot;') + '">→ ' + s + '</span>';
      }).join('');
    }
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    div.querySelectorAll('.sug').forEach(function(el) {
      el.addEventListener('click', function() {
        document.getElementById('ai-input').value = el.dataset.q;
        handleAI(el.dataset.q);
      });
    });
  }

  function getRecs(query, limit) {
    limit = limit || 6;
    var q = query.toLowerCase();
    var tokens = q.split(/\s+/).filter(function(t) { return t.length > 1; });
    var budgetMatch = q.match(/(?:under|below|less than)\s*₹?\s*(\d+)/i) || q.match(/₹\s*(\d+)/);
    var maxPrice = budgetMatch ? parseInt(budgetMatch[1], 10) : null;
    if (/under\s*500|under ₹500/i.test(q)) maxPrice = 500;
    if (/under\s*1000/i.test(q)) maxPrice = 1000;
    if (/under\s*2000/i.test(q)) maxPrice = 2000;
    if (/under\s*15000/i.test(q)) maxPrice = 15000;

    var list = PRODUCTS.slice();
    if (maxPrice != null) list = list.filter(function(p) { return p.price <= maxPrice; });

    if (/beauty|skincare|serum|cream|makeup|glow/i.test(q))
      list = list.filter(function(p) { return p.cat === 'Beauty' || /skin|beauty|hair|face|lip/i.test(p.name + (p.tags||[]).join(' ')); });
    if (/mobile|phone|smartphone/i.test(q))
      list = list.filter(function(p) { return p.cat === 'Mobiles' || /phone/i.test(p.name); });
    if (/earbud|headphone|audio|speaker/i.test(q))
      list = list.filter(function(p) { return /audio|earbud|headphone|speaker/i.test((p.tags||[]).join(' ') + p.name); });
    if (/shoe|run|sneaker/i.test(q))
      list = list.filter(function(p) { return /shoe|running|sneaker/i.test(p.name + (p.tags||[]).join(' ')); });
    if (/gift/i.test(q)) list = list.filter(function(p) { return p.price >= 299 && p.price <= 3000; });
    if (/trend|popular|best/i.test(q)) list = list.filter(function(p) { return p.badge || p.reviews > 10000; });

    var scored = list.map(function(p) {
      var s = 0;
      var hay = (p.name + ' ' + p.brand + ' ' + p.cat + ' ' + (p.tags || []).join(' ')).toLowerCase();
      tokens.forEach(function(t) { if (hay.indexOf(t) !== -1) s += 3; });
      s += (p.rating || 0);
      s += Math.min((p.reviews || 0) / 10000, 2);
      return { p: p, s: s };
    }).filter(function(x) { return x.s > 0 || maxPrice != null; })
      .sort(function(a, b) { return b.s - a.s; });

    if (scored.length) return scored.slice(0, limit).map(function(x) { return x.p; });
    return list.slice(0, limit);
  }

  function handleAI(raw) {
    var query = (raw || '').trim();
    if (!query) return;
    addMsg(query, true);
    document.getElementById('ai-input').value = '';

    setTimeout(function() {
      var lower = query.toLowerCase();
      if (/^(hi|hello|hey)\b/.test(lower)) {
        addMsg('Hi! Tell me what you need — category, budget, or product. Example: “beauty under 500” or “best phone under 15000”.', [
          'Beauty under ₹500', 'Mobile under ₹15000', 'Running shoes'
        ]);
        return;
      }
      if (/thank|thanks/.test(lower)) {
        addMsg('Happy to help! Anything else?');
        return;
      }

      var recs = getRecs(query, 8);
      filtered = recs;
      currentCat = 'all';
      document.querySelectorAll('.cat-chip').forEach(function(c) {
        c.classList.toggle('active', c.dataset.cat === 'all');
      });
      renderGrid();
      document.getElementById('results-count').textContent = 'AI picks for “' + query + '” (' + recs.length + ')';

      if (!recs.length) {
        addMsg('No matches. Try a different budget or category.');
        return;
      }
      var text = 'Here are my top picks:\n\n';
      recs.slice(0, 5).forEach(function(p, i) {
        text += (i + 1) + '. <strong>' + p.name + '</strong> — ' + fmt(p.price) + '\n';
      });
      text += '\nShowing them in the grid. Click Add to Cart or refine your ask.';
      addMsg(text, false, ['Show cheaper', 'Only Beauty', 'Add first to cart']);

      if (/add first|add the first|buy first/i.test(lower) && recs[0]) addToCart(recs[0].id);
    }, 350);
  }

  document.getElementById('grid').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-add]');
    if (btn) addToCart(parseInt(btn.dataset.add, 10));
  });
  document.getElementById('cart-body').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-qty]');
    if (btn) changeQty(parseInt(btn.dataset.qty, 10), parseInt(btn.dataset.delta, 10));
  });

  document.getElementById('cat-strip').addEventListener('click', function(e) {
    var chip = e.target.closest('.cat-chip');
    if (!chip) return;
    currentCat = chip.dataset.cat;
    searchQ = '';
    document.getElementById('search').value = '';
    document.querySelectorAll('.cat-chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    applyFilters();
  });

  document.getElementById('search').addEventListener('input', function(e) {
    searchQ = e.target.value;
    applyFilters();
  });
  document.getElementById('search').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && searchQ.trim()) handleAI(searchQ);
  });
  document.getElementById('sort').addEventListener('change', function(e) {
    sortBy = e.target.value;
    applyFilters();
  });

  document.querySelector('.banner-tags').addEventListener('click', function(e) {
    var t = e.target.closest('.b-tag');
    if (t) {
      handleAI(t.dataset.q);
      document.getElementById('ai-side').classList.add('open');
    }
  });

  document.getElementById('ai-go').addEventListener('click', function() {
    handleAI(document.getElementById('ai-input').value);
  });
  document.getElementById('ai-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleAI(document.getElementById('ai-input').value);
  });
  document.getElementById('ai-chips').addEventListener('click', function(e) {
    var c = e.target.closest('.chip');
    if (c) handleAI(c.dataset.q);
  });

  document.getElementById('cart-btn').addEventListener('click', function() {
    renderCart();
    document.getElementById('cart-bg').classList.add('open');
  });
  document.getElementById('cart-close').addEventListener('click', function() {
    document.getElementById('cart-bg').classList.remove('open');
  });
  document.getElementById('cart-bg').addEventListener('click', function(e) {
    if (e.target.id === 'cart-bg') document.getElementById('cart-bg').classList.remove('open');
  });
  document.getElementById('checkout').addEventListener('click', function() {
    if (!cart.length) { toast('Cart is empty'); return; }
    toast('Demo only — order not placed');
  });

  document.getElementById('fab-ai').addEventListener('click', function() {
    document.getElementById('ai-side').classList.add('open');
  });
  document.getElementById('ai-close').addEventListener('click', function() {
    document.getElementById('ai-side').classList.remove('open');
  });
  document.getElementById('logo').addEventListener('click', function(e) {
    e.preventDefault();
    currentCat = 'all'; searchQ = ''; sortBy = 'popular';
    document.getElementById('search').value = '';
    document.getElementById('sort').value = 'popular';
    document.querySelectorAll('.cat-chip').forEach(function(c) {
      c.classList.toggle('active', c.dataset.cat === 'all');
    });
    applyFilters();
  });

  updateCartBadge();
  applyFilters();
  addMsg('Hi! I\'m your AI shopping assistant. Browse categories above or ask me — e.g. “beauty under 500”, “best phone under 15000”.', [
    'Beauty under ₹500', 'Mobile under ₹15000', 'Trending deals'
  ]);
})();
  </script>
